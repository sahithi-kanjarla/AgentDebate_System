[project]
name = "tribunal-backend"
version = "0.1.0"
description = "Tribunal: multi-agent debate system (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sse-starlette",
    "pydantic>=2",
    "pydantic-settings",
    "sqlmodel",
    "pyyaml",
    "openai>=3.35.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC110"]  # test helpers poll plain predicates
